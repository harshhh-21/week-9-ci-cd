apiVersion: apps/v1
kind: Deployment
metadata:
  name: week9-cicd
  labels:
    app: week9-cicd
spec:
  replicas: 2

  selector:
    matchLabels:
      app: week9-cicd

  template:
    metadata:
      labels:
        app: week9-cicd

    spec:
      containers:
        - name: week9-cicd
          image: harshhh21/week9-cicd:9
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: APP_VERSION
              value: "v9"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
